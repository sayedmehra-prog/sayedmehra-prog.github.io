<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szee — Pengembang Game</title>
<meta name="description" content="Szee, pengembang game Android Akal-Akalan!">
<style>
  :root { --ink: #3B2A20; --bg: #FFF4DA; --card: #fff; --muted: #7a6656; --teal: #3FBFA8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 1.8em; }
  .lead { margin: 0 0 24px; color: var(--muted); }
  .app { display: flex; gap: 14px; align-items: center; background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 14px; }
  .app img { width: 72px; height: 72px; border-radius: 16px; border: 3px solid var(--ink); flex: none; }
  .app h2 { margin: 0 0 4px; font-size: 1.15em; }
  .app p { margin: 0 0 6px; color: var(--muted); font-size: .95em; }
  a { color: inherit; }
  .links a { margin-right: 12px; font-weight: 700; }
  footer { margin-top: 32px; font-size: .9em; color: var(--muted); }
  @media (prefers-color-scheme: dark) { :root { --ink: #F3E6D2; --bg: #241a14; --card: #33261d; --muted: #c7b39c; } }
</style>
</head>
<body>
<main>
  <h1>Szee</h1>
  <p class="lead">Pengembang game Android dari Indonesia.</p>
  <div class="app">
    <img src="akal-akalan-privasi/uji/ikon.png" alt="Ikon Akal-Akalan!">
    <div>
      <h2>Akal-Akalan! Teka-teki Benda</h2>
      <p>Game asah otak kocak: pilih benda yang tepat untuk menyelesaikan masalah sehari-hari.</p>
      <div class="links">
        <a href="https://play.google.com/store/apps/details?id=id.akalakalan.game">Google Play</a>
        <a href="akal-akalan-privasi/">Kebijakan privasi</a>
      </div>
    </div>
  </div>
  <footer>Kontak: <a href="mailto:sayedmehra@gmail.com">sayedmehra@gmail.com</a></footer>
</main>
</body>
</html>
